name: COO PDF 只读诊断
on:
  workflow_dispatch:
  push:
    branches: ['coo/manual-delivery-test-20261021']
    paths: ['coo/send-once-20261021.txt']
permissions:
  contents: read
concurrency:
  group: coo-document-send-test
  cancel-in-progress: false
jobs:
  test-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Transport unit tests
        run: python -m unittest discover -s coo -p 'test_transport.py' -v
      - name: Install isolated dependency
        run: python -m pip install requests==2.32.5
      - name: Read-only diagnostics - no send
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COO_TEST_PDF_ZLIB_B64: ${{ secrets.COO_TEST_PDF_ZLIB_B64 }}
        run: python coo/diagnose.py
