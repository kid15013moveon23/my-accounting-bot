name: COO 重点图片发送测试
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coo-document-send-test
  cancel-in-progress: false
jobs:
  test-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chinese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Transport unit tests
        run: python -m unittest discover -s coo -p 'test_*.py' -v
      - name: Install isolated dependency
        run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Send inline COO highlight photos once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COO_TEST_CARDS_ZLIB_B64: ${{ secrets.COO_TEST_CARDS_ZLIB_B64 }}
        run: python coo/run_image_test.py
