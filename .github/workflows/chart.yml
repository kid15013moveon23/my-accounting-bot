name: 趋势图（手动触发）
on:
  workflow_dispatch:
    inputs:
      days:
        description: '天数，默认 30'
        required: false
        default: '30'
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装中文字体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 安装依赖
        run: pip install gspread google-auth python-telegram-bot==21.6 pytz anthropic matplotlib
      - name: 只发趋势图
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GSHEET_SA_JSON: ${{ secrets.GSHEET_SA_JSON }}
          HISTORY_SHEET_ID: ${{ secrets.HISTORY_SHEET_ID }}
          CHART_ONLY: ${{ inputs.days }}
        run: python send_report.py
