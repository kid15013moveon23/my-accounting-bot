name: COO 加密报告图片投递
on:
  push:
    branches: ['coo/live-delivery']
    paths: ['inbox/*.json', '.coo/bootstrap']
permissions:
  contents: read
  actions: read
concurrency:
  group: coo-live-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and encryption dependencies
        run: python -m pip install requests==2.32.5 Pillow==11.3.0 cryptography==46.0.3
      - name: Install Chinese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Validate encryption and transports
        run: python -m unittest discover -s coo -p 'test_*.py' -v
      - name: Decrypt, render and deliver photos once
        id: delivery
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python coo/deliver.py
      - name: Retain delivery ledger for replay protection
        if: always() && steps.delivery.outputs.ledger_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.delivery.outputs.ledger_name }}
          path: ${{ runner.temp }}/coo-receipt/receipt.json
          retention-days: 90
          if-no-files-found: ignore
