name: 数据重新抓取（手动触发）

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '开始日期，格式 2026-07-23'
        required: true
      end_date:
        description: '结束日期（留空 = 只跑开始日期这一天）'
        required: false
        default: ''
      send_report:
        description: '抓完后是否重发日报到 Telegram'
        required: true
        type: choice
        options:
          - '否'
          - '是'
        default: '否'

jobs:
  refetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install gspread google-auth python-telegram-bot==21.6 pytz anthropic
      - name: 重新抓取并覆盖历史数据
        env:
          GSHEET_SA_JSON: ${{ secrets.GSHEET_SA_JSON }}
          HISTORY_SHEET_ID: ${{ secrets.HISTORY_SHEET_ID }}
          BACKFILL_START: ${{ inputs.start_date }}
          BACKFILL_END: ${{ inputs.end_date }}
        run: python backfill_history.py
      - name: 重发日报
        if: ${{ inputs.send_report == '是' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GSHEET_SA_JSON: ${{ secrets.GSHEET_SA_JSON }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          HISTORY_SHEET_ID: ${{ secrets.HISTORY_SHEET_ID }}
        run: python send_report.py
